name: CI

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, audit, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit
      - name: Run validation tests
        run: npm test
      - name: Run ESLint
        run: npm run lint
      - name: Build frontend
        run: npm run build
