name: Temporary package cleanup

on:
  push:
    branches:
      - "work/secure-ai-api-2026-10-25"

permissions:
  contents: write

jobs:
  update-package-metadata:
    name: Remove unused dependency and normalize package name
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Rename package and remove unused speech wrapper
        run: |
          npm pkg set name=ai-companion
          npm uninstall react-speech-recognition
      - name: Commit package manifest and lockfile
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Package metadata is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore: align package metadata and remove unused dependency"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Verify clean installation
        run: npm ci
      - name: Run validation tests
        run: npm test
      - name: Run ESLint
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Require a clean npm audit
        run: npm audit
