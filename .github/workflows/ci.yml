name: CI

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Report npm audit findings
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node --input-type=module - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          import { readFileSync } from "node:fs";

          const report = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const meta = report.metadata?.vulnerabilities ?? {};
          const names = Object.entries(report.vulnerabilities ?? {});
          console.log("npm audit severity totals:", JSON.stringify(meta));
          for (const [name, item] of names) {
            const advisories = (item.via ?? [])
              .filter((entry) => typeof entry === "object")
              .map(({ title, url, range }) => ({ title, url, range }));
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              isDirect: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              advisories,
            }));
          }
          NODE
      - name: Run validation tests
        run: npm test
      - name: Run ESLint
        run: npm run lint
      - name: Build frontend
        run: npm run build
