name: Temporary dependency remediation

on:
  push:
    branches:
      - "work/secure-ai-api-2026-10-25"

permissions:
  contents: write

jobs:
  update-lockfile:
    name: Apply compatible npm security fixes
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply non-breaking security fixes
        run: npm audit fix
      - name: Commit updated npm dependency tree
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "npm audit fix produced no dependency changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix: update vulnerable npm dependencies"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Run validation tests
        run: npm test
      - name: Run ESLint
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Require a clean npm audit
        run: npm audit
